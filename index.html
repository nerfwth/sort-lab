<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sort Lab · 看见排序的每一步</title>
  <meta name="description" content="交互式排序算法实验室：通过动画、单步执行与操作统计学习三种排序算法。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172e2a'/%3E%3Cpath d='M8 24V16M16 24V10M24 24V6' stroke='%23b8ee80' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="brand" href="./">▥ &nbsp; SORT LAB</a><span>算法实验室 / 01</span></header>
  <main>
    <section class="intro"><div class="eyebrow">LEARN BY WATCHING</div><h1>看见排序的每一步<span>。</span></h1><p>让抽象的算法动起来。在比较与交换之间，理解有序如何诞生。</p></section>
    <section class="lab" aria-label="排序实验区">
      <div class="toolbar"><label>排序算法<select id="algorithm"><option value="bubble">冒泡排序</option><option value="insertion">插入排序</option><option value="selection">选择排序</option></select></label><label>数据规模 <output id="size-value">20</output><input id="size" aria-label="数据规模" type="range" min="5" max="40" value="20"></label><label>动画速度 <output id="speed-value">8 步/秒</output><input id="speed" aria-label="动画速度" type="range" min="1" max="30" value="8"></label><button id="shuffle" class="secondary">↻ 生成新数据</button></div>
      <div class="chart-head"><span id="phase" role="status" aria-live="polite">准备就绪，开始探索</span><div class="legend"><span>● 待排序</span><span class="active-key">● 比较 / 交换</span><span class="done-key">● 已完成</span></div></div>
      <div id="chart" class="chart" role="img" aria-label="待排序的柱状图"></div>
      <div class="playback"><div class="buttons"><button id="play">▶ 开始排序</button><button id="step" class="secondary">单步 →</button><button id="reset" class="text-button">重置</button></div><span id="progress">步骤 0 / 0</span></div>
      <div class="stats"><div><span>比较次数</span><strong id="comparisons">0</strong></div><div><span>交换次数</span><strong id="swaps">0</strong></div><div><span>时间复杂度 · 平均</span><strong>O(n²)</strong></div><div><span>额外空间 · 算法本身</span><strong>O(1)</strong></div></div>
    </section>
    <section class="notes"><div><span class="eyebrow">HOW IT WORKS</span><h2 id="title">冒泡排序</h2><p id="explanation"></p><p class="hint">试一试：暂停动画，再点击「单步」，观察下一次比较。</p></div><div class="code-card"><span>核心思路 / 伪代码</span><pre id="pseudocode"></pre></div></section>
  </main><footer><span>SORT LAB</span><span>用 Coding Agent 构建 · 为理解而做</span></footer>
  <script src="algorithms.js"></script><script src="app.js"></script>
</body></html>
